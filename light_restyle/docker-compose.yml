services:
  cli:
    build:
      context: .
      dockerfile: Dockerfile.cli
    volumes:
      - ./data:/data
    command: ["--help"]

  webapp:
    image: node:18-alpine
    working_dir: /app
    volumes:
      - ./webapp:/app
    ports:
      - "8080:8080"
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "8080"]
